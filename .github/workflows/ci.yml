name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      # npm 11's stricter lockfile check catches drift that Node 20's bundled npm 10 misses
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
